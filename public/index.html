<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FarmaGerci — Gestão Inteligente de Estoque & Falta</title>
  <script src="https://tailwindcss.com"></script>
  <link rel="preconnect" href="https://googleapis.com">
  <link rel="preconnect" href="https://gstatic.com" crossorigin>
  <link href="https://googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: { sans: ['"Plus Jakarta Sans"', 'sans-serif'] },
          colors: {
            gerci: {
              50: '#faf5ff',
              100: '#f3e8ff',
              200: '#e9d5ff',
              500: '#a855f7',
              600: '#7e22ce',
              700: '#6b21a8',
              800: '#581c87',
              900: '#3b0764',
            }
          }
        }
      }
    }
  </script>
  <style>
    .card-hover { transition: all 0.22s cubic-bezier(0.4, 0, 0.2, 1); }
    .card-hover:hover { transform: translateY(-3px); box-shadow: 0 12px 24px -8px rgba(107, 33, 168, 0.18); }
  </style>
</head>
<body class="bg-[#F6F5F9] text-slate-800 min-h-screen flex flex-col">

  <!-- Toast Flutuante -->
  <div id="toast" class="fixed bottom-6 right-6 z-50 hidden items-center gap-3 bg-gerci-900 text-white px-5 py-3.5 rounded-2xl shadow-2xl border border-gerci-600/40 text-sm font-semibold">
    <span class="w-2.5 h-2.5 rounded-full bg-emerald-400 animate-ping"></span>
    <span id="toast-msg">Atualizado!</span>
  </div>

  <!-- Topbar Estilo E-commerce Farmacêutico -->
  <div class="bg-gerci-900 text-purple-200 text-xs py-1.5 px-4">
    <div class="max-w-7xl mx-auto flex justify-between items-center">
      <span>Portal Interno de Controle de Ruptura & Reposição • <strong>FarmaGerci</strong></span>
      <span id="status-conexao" class="font-semibold text-emerald-300">● Conectado ao Banco</span>
    </div>
  </div>

  <header class="bg-gradient-to-r from-gerci-800 via-gerci-700 to-purple-800 text-white sticky top-0 z-40 shadow-lg">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 py-4 flex flex-col lg:flex-row items-center justify-between gap-4">
      
      <!-- Logo FarmaGerci -->
      <div class="flex items-center justify-between w-full lg:w-auto">
        <div class="flex items-center gap-3">
          <div class="w-11 h-11 rounded-2xl bg-white text-gerci-700 flex items-center justify-center shadow-md font-extrabold text-2xl">
            +
          </div>
          <div>
            <h1 class="text-2xl font-extrabold tracking-tight leading-none">Farma<span class="text-purple-200">Gerci</span></h1>
            <p class="text-[11px] text-purple-200 font-medium mt-0.5">Gestão de Falta & Estoque Crítico</p>
          </div>
        </div>

        <button onclick="abrirModalNovo()" class="lg:hidden bg-white text-gerci-700 font-bold px-4 py-2 rounded-full text-xs shadow">
          + Registrar Falta
        </button>
      </div>

      <!-- Barra de Busca Central Estilo Drogasil -->
      <div class="relative w-full lg:max-w-xl">
        <input type="text" id="busca" oninput="renderizar()"
          placeholder="O que você procura? Ex: Trazodona, Dipirona, Losartana..."
          class="w-full bg-white text-slate-800 placeholder-slate-400 pl-5 pr-12 py-3 rounded-full text-sm font-medium shadow-inner focus:outline-none focus:ring-4 focus:ring-purple-400/40" />
        <div class="absolute right-2 top-1.5 bg-gerci-600 text-white p-2 rounded-full">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" />
          </svg>
        </div>
      </div>

      <!-- Ações Rápidas -->
      <div class="hidden lg:flex items-center gap-3">
        <button onclick="copiarPedidoFalta()" class="inline-flex items-center gap-2 bg-gerci-900/50 hover:bg-gerci-900 text-white border border-purple-400/30 px-4 py-2.5 rounded-full text-xs font-semibold transition">
          <svg class="w-4 h-4 text-purple-300" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M8 5H6a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2v-1M8 5a2 2 0 002 2h2a2 2 0 002-2M8 5a2 2 0 012-2h2a2 2 0 012 2"/></svg>
          Copiar Lista de Compra
        </button>
        <button onclick="abrirModalNovo()" class="inline-flex items-center gap-2 bg-white hover:bg-purple-50 text-gerci-800 font-bold px-5 py-2.5 rounded-full text-sm shadow-md transition">
          <span class="text-lg leading-none">+</span> Cadastrar / Falta
        </button>
      </div>
    </div>
  </header>

  <main class="max-w-7xl mx-auto px-4 sm:px-6 py-7 space-y-6 flex-1 w-full">

    <!-- Faixa de Alerta Interativa -->
    <div id="banner-alerta" class="hidden bg-gradient-to-r from-rose-600 to-red-600 text-white rounded-2xl p-4 sm:px-6 shadow-md flex flex-col sm:flex-row items-start sm:items-center justify-between gap-4">
      <div class="flex items-center gap-3.5">
        <div class="w-10 h-10 rounded-xl bg-white/20 flex items-center justify-center font-extrabold text-lg shrink-0">!</div>
        <div>
          <p class="font-bold text-sm sm:text-base">Alerta de Ruptura na FarmaGerci</p>
          <p id="banner-texto" class="text-xs text-rose-100">Existem medicamentos zerados aguardando reposição.</p>
        </div>
      </div>
      <div class="flex gap-2 w-full sm:w-auto">
        <button onclick="copiarPedidoFalta()" class="flex-1 sm:flex-none bg-white/15 hover:bg-white/25 text-white text-xs font-semibold px-4 py-2 rounded-full transition">
          Copiar p/ WhatsApp
        </button>
        <button onclick="selecionarFiltro('FALTA')" class="flex-1 sm:flex-none bg-white text-rose-700 hover:bg-rose-50 text-xs font-bold px-4 py-2 rounded-full shadow transition">
          Filtrar Faltas
        </button>
      </div>
    </div>

    <!-- Cards de Métricas Clicáveis -->
    <section class="grid grid-cols-2 lg:grid-cols-4 gap-4">
      <button onclick="selecionarFiltro('TODOS')" id="btn-card-TODOS" class="text-left bg-white p-5 rounded-2xl border-2 border-gerci-600 shadow-sm card-hover">
        <div class="flex justify-between items-center">
          <span class="text-xs font-bold uppercase text-slate-400">Catálogo Total</span>
          <span class="w-8 h-8 rounded-xl bg-gerci-100 text-gerci-700 flex items-center justify-center font-bold text-sm">#</span>
        </div>
        <p id="card-total" class="text-3xl font-extrabold text-slate-900 mt-2">0</p>
        <p class="text-xs text-gerci-600 font-semibold mt-1">Ver todos os itens →</p>
      </button>

      <button onclick="selecionarFiltro('FALTA')" id="btn-card-FALTA" class="text-left bg-white p-5 rounded-2xl border-2 border-transparent shadow-sm card-hover">
        <div class="flex justify-between items-center">
          <span class="text-xs font-bold uppercase text-rose-600">Em Falta (Zero)</span>
          <span class="w-8 h-8 rounded-xl bg-rose-100 text-rose-600 flex items-center justify-center font-bold text-sm">0</span>
        </div>
        <p id="card-falta" class="text-3xl font-extrabold text-rose-600 mt-2">0</p>
        <p class="text-xs text-slate-400 font-medium mt-1">Ruptura de estoque</p>
      </button>

      <button onclick="selecionarFiltro('CRITICO')" id="btn-card-CRITICO" class="text-left bg-white p-5 rounded-2xl border-2 border-transparent shadow-sm card-hover">
        <div class="flex justify-between items-center">
          <span class="text-xs font-bold uppercase text-amber-600">Estoque Baixo</span>
          <span class="w-8 h-8 rounded-xl bg-amber-100 text-amber-600 flex items-center justify-center font-bold text-sm">!</span>
        </div>
        <p id="card-critico" class="text-3xl font-extrabold text-amber-600 mt-2">0</p>
        <p class="text-xs text-slate-400 font-medium mt-1">Abaixo do mínimo</p>
      </button>

      <button onclick="selecionarFiltro('NORMAL')" id="btn-card-NORMAL" class="text-left bg-white p-5 rounded-2xl border-2 border-transparent shadow-sm card-hover">
        <div class="flex justify-between items-center">
          <span class="text-xs font-bold uppercase text-emerald-600">Disponíveis</span>
          <span class="w-8 h-8 rounded-xl bg-emerald-100 text-emerald-600 flex items-center justify-center font-bold text-sm">✓</span>
        </div>
        <p id="card-normal" class="text-3xl font-extrabold text-emerald-600 mt-2">0</p>
        <p class="text-xs text-slate-400 font-medium mt-1">Abastecimento normal</p>
      </button>
    </section>

    <!-- Barra de Controle: Pílulas de Filtro + Troca de Visualização -->
    <section class="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-3 pt-1">
      <div class="flex flex-wrap gap-2">
        <button onclick="selecionarFiltro('TODOS')" data-pill="TODOS" class="pill-btn bg-gerci-700 text-white px-4 py-1.5 rounded-full text-xs font-bold transition">Todos</button>
        <button onclick="selecionarFiltro('FALTA')" data-pill="FALTA" class="pill-btn bg-white text-slate-600 hover:bg-purple-50 px-4 py-1.5 rounded-full text-xs font-bold border border-slate-200 transition">Em Falta</button>
        <button onclick="selecionarFiltro('CRITICO')" data-pill="CRITICO" class="pill-btn bg-white text-slate-600 hover:bg-purple-50 px-4 py-1.5 rounded-full text-xs font-bold border border-slate-200 transition">Nível Crítico</button>
        <button onclick="selecionarFiltro('NORMAL')" data-pill="NORMAL" class="pill-btn bg-white text-slate-600 hover:bg-purple-50 px-4 py-1.5 rounded-full text-xs font-bold border border-slate-200 transition">Disponível</button>
      </div>

      <div class="flex items-center gap-2 self-end sm:self-auto">
